services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: candidate_tracker
      POSTGRES_PASSWORD: candidate_tracker
      POSTGRES_DB: candidate_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
